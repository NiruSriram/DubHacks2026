<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Later · Visa</title><link rel="icon" href="/assets/favicon.svg"><link rel="stylesheet" href="/secure-card.css"></head><body><header><span class="wordmark">later<span>.</span></span><strong class="visa">VISA</strong></header><main id="payment"><h1>Confirm your wait</h1><div class="hold-summary"><span>Maximum test hold</span><strong id="holdAmount">—</strong></div><label for="cardNumber">Card number</label><div id="cardNumber" class="hosted-field"></div><div class="fields-row"><div class="field"><label for="expMonth">Month</label><input id="expMonth" placeholder="MM" maxlength="2" inputmode="numeric" autocomplete="off"></div><div class="field"><label for="expYear">Year</label><input id="expYear" placeholder="YYYY" maxlength="4" inputmode="numeric" autocomplete="off"></div><div class="field"><label for="cardCvv">CVV</label><div id="cardCvv" class="hosted-field"></div></div></div><button id="loadCard" class="quiet">Connect card entry</button><p id="cardStatus" role="status"></p><button class="primary" id="useCard">Authorize test hold</button><p class="test-note">Test card 4111 1111 1111 1111 · CVV 123</p><p id="cardError" role="alert"></p></main><section id="success" class="success" hidden><div class="success-mark" aria-hidden="true">✓</div><h1>Your wait has started.</h1><p>Open Later to see merchant offers.</p><button id="closeWindow" class="primary">Done</button></section><script src="/card-entry.js"></script><script>
let commitDraft=null;try{if(location.hash.startsWith('#commit=')){commitDraft=JSON.parse(decodeURIComponent(location.hash.slice(8)));history.replaceState(null,'',location.pathname);const total=commitDraft.items.reduce((sum,x)=>sum+Number(x.price)*Number(x.quantity),0);document.getElementById('holdAmount').textContent=new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'}).format(total);}}catch{document.getElementById('cardError').textContent='Could not load the cart. Close this window and retry from Later.';}
document.getElementById('closeWindow').onclick=()=>window.close();
document.getElementById('useCard').onclick=async()=>{const button=document.getElementById('useCard');button.disabled=true;document.getElementById('cardError').textContent='';try{const token=await window.tokenizeCard();if(commitDraft){const response=await fetch('/api/commit',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({...commitDraft,cardToken:token})});const data=await response.json();if(!response.ok)throw new Error(data.error);if(data.cart.status==='authorized'){document.getElementById('payment').hidden=true;document.getElementById('success').hidden=false;}else{document.getElementById('cardError').textContent='Check your hold in Later before trying again.';button.hidden=true;}return;}throw new Error('Open card entry from Later.');}catch(e){document.getElementById('cardError').textContent=e.message}finally{button.disabled=false}};
</script></body></html>
